name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request that is pushed to again abandons the run it just superseded;
# `main` keeps every run, because each merge is the authoritative check of a commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # A pull request verifies what it changed against its base branch; a merge into
  # `main` verifies the whole workspace, so nothing reaches `main` unverified
  # because it happened to sit outside a changed package.
  SELECTOR: ${{ github.event_name == 'pull_request' && format('--changed=origin/{0}', github.base_ref) || '' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: `--changed` compares against a base branch ref, which a
      # shallow clone does not contain.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # `--changed` falls back to working-tree changes when its base ref is
      # missing, which in CI would mean verifying nothing and passing. Fail loudly
      # instead.
      - name: Assert the base ref is present
        if: github.event_name == 'pull_request'
        run: git rev-parse --verify origin/${{ github.base_ref }}

      # A change to CI itself belongs to no package, so `--changed` would select
      # none and the run would pass without exercising what changed. Such a pull
      # request is verified the way its merge will be: the whole workspace.
      - name: Widen the selection for a change to CI
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^\.github/'; then
            echo "SELECTOR=" >> "$GITHUB_ENV"
          fi

      # Browser tests are skipped here because the browser job owns them; running
      # them twice would double the slowest step of the run.
      - name: Verify
        run: pnpm verify --skip=test:browser $SELECTOR

  # The browser jobs run in Playwright's own image, which carries the system
  # libraries and the browsers of one Playwright version. Installing them on a
  # bare runner meant about 130 MB from the runner's Ubuntu package mirror on
  # every run, and that mirror stalled often enough to fail merges; `docs/ci.md`
  # has the history. The image is chosen by the version the lockfile pins, so a
  # Playwright upgrade moves CI with it. A container's image is fixed before its
  # steps run, so the version is read here, in a job of its own.
  playwright:
    name: Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out the lockfile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      # One image holds one version's browsers, so a lockfile with two versions,
      # or with none because its format moved, fails here rather than testing
      # against browsers the packages do not use.
      - name: Resolve the image
        id: image
        run: |
          versions="$(grep -oE "^  playwright-core@[^:]+" pnpm-lock.yaml | sed "s/^  playwright-core@//" | sort -u)"
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected one playwright-core version in pnpm-lock.yaml, found: ${versions:-none}"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v${versions}-noble" >> "$GITHUB_OUTPUT"

  browser:
    # One engine per job. The suites are the slowest thing in a run and the three
    # engines are independent, so running them side by side costs runner minutes
    # rather than wall-clock time. `fail-fast` is off because "Firefox broke" and
    # "WebKit broke" are different findings and cancelling one to report the other
    # hides half the answer.
    name: Browser tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: playwright
    # The runner's own user, as Playwright's CI guide recommends: the workspace
    # and home the runner mounts are owned by it, and Firefox refuses to start as
    # root in a home another user owns.
    container:
      image: ${{ needs.playwright.outputs.image }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Assert the base ref is present
        if: github.event_name == 'pull_request'
        run: git rev-parse --verify origin/${{ github.base_ref }}

      # As in the verify job: a change to CI runs every browser suite.
      - name: Widen the selection for a change to CI
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^\.github/'; then
            echo "SELECTOR=" >> "$GITHUB_ENV"
          fi

      # The image already holds this version's browsers, so this downloads nothing.
      # It stays because it is the command a contributor runs, and it is what
      # would notice an image and a lockfile that disagree.
      - name: Install browsers
        run: pnpm hub browsers $SELECTOR -- ${{ matrix.engine }}

      # Every package names its Playwright projects after the engine they run on,
      # so one glob selects this job's engine across all of them. See
      # `docs/specs/tests.md` for the naming rule.
      - name: Run browser tests
        run: pnpm test:browser $SELECTOR -- --project='*${{ matrix.engine }}*'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-results-${{ matrix.engine }}
          path: |
            packages/*/test-results/**
            packages/*/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7

  # `@codenhub/validation` declares Node.js 22 in its engines and reads URLs and
  # domains with the runtime's own URL parser, which changes between Node.js
  # versions, while the workspace runs one pinned version. Its unit tests run here
  # on the oldest Node.js its engines allow and on 24.19, whose parser aborts the
  # process when some hosts are written back; `docs/ci.md` has the reasons. The
  # workspace is installed with the pinned version, which `engine-strict`
  # requires, and the tests are run with the other one. They are cheap, so they
  # run on every pull request rather than only when the package changed.
  validation-runtimes:
    name: Validation on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24.19"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Switch to Node.js ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}

      # The unit tests import the source, so nothing is built; `npx` runs the
      # installed Vitest with the Node.js now on the path, where `pnpm` would
      # check the workspace's engines first.
      - name: Run the unit tests
        working-directory: packages/validation
        run: |
          node --version
          npx --no-install vitest run src

  # The name a protected `main` requires. A matrix reports one check per engine,
  # so the single check the branch rule names would never arrive and every pull
  # request would wait on it forever. This job carries that name and passes only
  # when every engine job did, which keeps the rule satisfied without it naming
  # the engines: adding or removing one changes this file and nothing else.
  #
  # `always()` is what makes it a gate rather than a formality. Without it a
  # failing engine job skips this one, and a skipped required check blocks a pull
  # request just as an unreported one does — reporting the failure is the point.
  browser-result:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: browser
    if: always()
    steps:
      - name: Report the engine jobs
        run: |
          echo "Engine jobs finished with: ${{ needs.browser.result }}"
          test "${{ needs.browser.result }}" = "success"

  drift:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: playwright
    # `@codenhub/styles`' `styles-palette` generator reads real composed colors
    # from a real headless browser rather than reimplementing `color-mix()` math
    # by hand (see `docs/internal/generated-palette.md`), so the drift check needs
    # Chromium, from the same image and as the same user as the browser jobs.
    container:
      image: ${{ needs.playwright.outputs.image }}
      options: --user 1001
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Install browsers
        run: pnpm hub browsers styles -- chromium

      # Generated files are derived from READMEs, package docs, and manifests, so
      # a change that edits a source without regenerating leaves the repository
      # describing itself incorrectly. The dry run reports which files are stale
      # and exits non-zero without writing any of them.
      - name: Check generated files
        run: pnpm generate --dry-run

      # A dry run must write nothing; this fails if it ever does. `git diff`
      # alone misses a file the run created, so untracked files are checked too.
      - name: Assert the working tree is unchanged
        run: |
          git diff --exit-code
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::The dry run left files in the working tree."
            exit 1
          fi
