name: Vite

# `@codenhub/styles/vite` runs inside the consumer's Vite, anywhere in the range
# its optional `vite` peer declares, while the workspace builds and tests with
# the one version its catalog pins. This workflow runs the plugin's integration
# suite against the floor of that range and the newest 5.x, 6.x, and 7.x; the
# catalog's Vite runs in `ci.yml`.
#
# It is a workflow of its own for its `paths` filter, as `tailwind.yml` is
# (`docs/ci.md`).
on:
  pull_request:
    paths:
      - packages/styles/**
      - .github/**
  # `paths` does not apply to a merge group, so the queue always runs every job.
  merge_group:

# As in `ci.yml`: a newer push supersedes a pull request's run, and a
# merge-queue run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  vite:
    name: Vite ${{ matrix.vite }} consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vite: [floor, "5", "6", "7"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # Under another name, because Vitest needs a Vite of its own and Vitest 4
      # needs Vite 6 or newer. The suite loads `VITE_UNDER_TEST` when it is set.
      # The floor is read from the peer range, so raising it there moves this
      # job too.
      - name: Install the consumer's Vite
        working-directory: packages/styles
        run: |
          if [ "${{ matrix.vite }}" = floor ]; then
            version="$(node -p "/^>=(\d+\.\d+\.\d+)$/.exec(require('./package.json').peerDependencies.vite)?.[1] ?? ''")"
            if [ -z "$version" ]; then
              echo "::error::packages/styles/package.json no longer states the vite peer as >=x.y.z"
              exit 1
            fi
          else
            version="${{ matrix.vite }}"
          fi
          pnpm add --save-dev "vite-under-test@npm:vite@$version"
          node -p "'vite ' + require('vite-under-test/package.json').version"

      - name: Run the plugin's integration suite
        env:
          VITE_UNDER_TEST: vite-under-test
        run: pnpm test packages/styles/tests/integration/vite.test.ts
