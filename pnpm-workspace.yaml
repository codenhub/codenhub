packages:
  - "apps/*"
  - "packages/*"
  - "packages/*/{dev,debug,demo}"
  - "packages/*/{dev,debug}/*"
  - "packages/plugins/**"

catalog:
  "@astrojs/check": ^0.9.12
  "@astrojs/markdown-remark": 7.3.4
  "@codenhub/error": ^0.2.1
  "@codenhub/jwt": ^0.0.1
  "@codenhub/store": ^0.0.2
  "@codenhub/styles": ^0.6.0
  "@codenhub/theme": ^0.1.2
  "@codenhub/validation": ^0.3.0
  "@tauri-apps/api": ^2.0.0
  "@tailwindcss/cli": ^4.3.2
  "@tailwindcss/vite": ^4.3.2
  # Tilde, not caret: Dependabot holds the target below 1.64 (`.github/dependabot.yml`), but a caret range
  # it raises to ^1.63 still resolves to 1.64, as on #352.
  "@playwright/test": ~1.63.0
  "@types/node": ^26.1.0
  "@vitest/coverage-v8": ^4.1.10
  astro: ^7.4.2
  esbuild: ^0.28.1
  jose: ^6.2.13
  oidc-provider: ^9.13.0
  openid-client: ^6.8.8
  jsdom: ^30.1.3
  miniflare: ^5.20261012.1-beta
  oxfmt: ^0.74.0
  oxlint: ^1.89.0
  prettier: ^3.6.0
  tailwindcss: ^4.3.2
  tsdown: ^0.23.2
  typedoc: ^0.28.20
  typescript: ^6.0.3
  vite: ^8.3.5
  vitest: ^4.1.10
  wrangler: ^4.152.0

blockExoticSubdeps: true
trustPolicy: no-downgrade
# @astrojs/check needs chokidar ^4.0.3. chokidar 4.0.1 shipped with provenance;
# 4.0.2 and 4.0.3 were published by hand by the same maintainer, which the
# policy reads as a downgrade. Remove once @astrojs/check moves to chokidar 5.
trustPolicyExclude:
  - "chokidar@4.0.3"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  workerd: true

# A public package installs its public siblings from npm through the catalog,
# never from the working tree (docs/specs/packages-lifecycle.md, "Ranges").
# Pinned rather than left to pnpm's default, which already behaves this way, so
# a change of default cannot start linking them silently.
linkWorkspacePackages: false

minimumReleaseAgeExclude:
  - "@codenhub/validation@0.3.0"
  - "@codenhub/jwt@0.0.1"
