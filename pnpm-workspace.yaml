packages:
  - "apps/*"
  - "packages/*"
  - "packages/*/{dev,debug,demo}"
  - "packages/*/{dev,debug}/*"
  - "packages/plugins/**"

catalog:
  "@astrojs/check": ^0.9.10
  "@astrojs/markdown-remark": 7.3.3
  "@codenhub/error": ^0.2.1
  "@codenhub/jwt": ^0.0.1
  "@codenhub/store": ^0.0.2
  "@codenhub/styles": ^0.6.0
  "@codenhub/theme": ^0.1.2
  "@codenhub/validation": ^0.3.0
  "@tauri-apps/api": ^2.0.0
  "@tailwindcss/cli": ^4.3.2
  "@tailwindcss/vite": ^4.3.2
  "@playwright/test": ^1.61.1
  "@types/node": ^26.1.0
  "@vitest/coverage-v8": ^4.1.10
  astro: ^7.0.7
  esbuild: ^0.28.1
  jose: ^6.2.12
  oidc-provider: ^9.12.2
  openid-client: ^6.8.8
  jsdom: ^29.1.1
  miniflare: ^5.20261012.1-beta
  oxfmt: ^0.73.0
  oxlint: ^1.72.0
  prettier: ^3.6.0
  tailwindcss: ^4.3.2
  tsdown: ^0.22.3
  typedoc: ^0.28.20
  typescript: ^7.0.2
  vite: ^8.1.3
  vitest: ^4.1.10
  wrangler: ^4.120.0

blockExoticSubdeps: true
trustPolicy: no-downgrade
# @astrojs/check needs chokidar ^4.0.3. chokidar 4.0.1 shipped with provenance;
# 4.0.2 and 4.0.3 were published by hand by the same maintainer, which the
# policy reads as a downgrade. Remove once @astrojs/check moves to chokidar 5.
trustPolicyExclude:
  - "chokidar@4.0.3"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  workerd: true

# A public package installs its public siblings from npm through the catalog,
# never from the working tree (docs/specs/packages-lifecycle.md, "Ranges").
# Pinned rather than left to pnpm's default, which already behaves this way, so
# a change of default cannot start linking them silently.
linkWorkspacePackages: false

minimumReleaseAgeExclude:
  - "@codenhub/validation@0.3.0"
  - "@codenhub/jwt@0.0.1"
