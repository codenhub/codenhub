packages:
  - "apps/*"
  - "packages/*"
  - "packages/*/{dev,debug,demo}"
  - "packages/*/{dev,debug}/*"
  - "packages/plugins/**"

# Every version is declared once, here, and packages refer to it as `catalog:`, so the workspace can never
# hold two versions of one dependency by accident. A new third-party dependency adds its version here.
catalog:
  "@astrojs/check": ^0.9.12
  "@astrojs/markdown-remark": 7.3.5
  "@cloudflare/workers-types": ^5.20261019.1
  "@codenhub/error": ^0.3.0
  "@codenhub/jwt": ^0.0.1
  "@codenhub/store": ^0.0.2
  "@codenhub/styles": ^0.6.0
  "@codenhub/theme": ^0.2.2
  "@codenhub/validation": ^0.3.0
  "@tauri-apps/api": ^2.0.0
  "@tailwindcss/cli": ^4.3.2
  "@tailwindcss/vite": ^4.3.2
  # Tilde, not caret: Dependabot holds the target below 1.64 (`.github/dependabot.yml`), but a caret range
  # it raises to ^1.63 still resolves to 1.64, as on #352.
  "@playwright/test": ~1.63.0
  "@types/node": ^26.6.6
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  "@vitest/coverage-v8": ^4.1.10
  astro: ^7.4.4
  esbuild: ^0.28.1
  jose: ^6.2.14
  oidc-provider: ^9.13.3
  openid-client: ^6.8.8
  jsdom: ^30.1.3
  miniflare: ^5.20261023.3-beta
  oxfmt: ^0.75.0
  oxlint: ^1.90.0
  prettier: ^3.6.0
  react: ^19.0.0
  react-dom: ^19.0.0
  tailwindcss: ^4.3.2
  tsdown: ^0.23.4
  typedoc: ^0.28.20
  typescript: ^6.0.3
  vite: ^8.3.5
  vitest: ^4.1.10
  wrangler: ^4.156.0

# TypeDoc still requires minimatch 10, which is affected by GHSA-g3hv-75wg-m249.
# The TypeDoc patch adapts its glob walker to minimatch 11. Remove both once
# TypeDoc requires minimatch >=11.0.1.
overrides:
  "typedoc>minimatch": ^11.0.4

# Supply-chain rules, applied to every install, local and in CI alike (docs/ci.md, "Dependency installs").
# Refuses a transitive dependency that resolves to a git repository or a tarball URL instead of the registry.
blockExoticSubdeps: true
# Refuses a version published with weaker trust evidence (provenance, trusted publishing) than an earlier
# version of the same package, a common sign of a compromised publish.
trustPolicy: no-downgrade
# Seven days, in minutes: a version published longer ago than this is no longer held to the trust policy, so
# a long-standing release that predates provenance is not refused as a downgrade. It is what lets
# chokidar@4.0.3, published by hand in 2024 after a release with provenance, resolve without an exclude.
trustPolicyIgnoreAfter: 10080
# The only dependencies whose install scripts may run. Each fetches or builds a native binary on install:
# esbuild and workerd their executables, @parcel/watcher its file-watching addon.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  workerd: true

# A public package installs its public siblings from npm through the catalog,
# never from the working tree (docs/specs/packages-lifecycle.md, "Ranges").
# Pinned rather than left to pnpm's default, which already behaves this way, so
# a change of default cannot start linking them silently.
linkWorkspacePackages: false

minimumReleaseAgeExclude:
  - "@codenhub/validation@0.3.0"
  - "@codenhub/jwt@0.0.1"
  - "@codenhub/error@0.3.0"
  - "@codenhub/theme@0.2.2"
patchedDependencies:
  typedoc@0.28.20: patches/typedoc@0.28.20.patch

# Makes pnpm refuse an install outside `engines` in package.json instead of only printing a warning, so a
# mismatch surfaces before it turns into a failure no one can reproduce (docs/ci.md, "Toolchain"). It lives
# here because pnpm ignores `engine-strict` in .npmrc: checked with pnpm 11.7 and 12.16.
engineStrict: true
