<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forms | @codenhub/styles playground</title>
    <script src="/shared/playground.js"></script>
    <link rel="stylesheet" href="/shared/playground.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="sect bg-background text-text font-default" data-testid="preview-root">
      <section class="sect-inn">
        <header class="stack tight">
          <p class="text-label">UI fixtures</p>
          <h1 class="text-title-lg">Forms</h1>
          <p class="text-body text-text-secondary">Input controls, icon configurations, field states, and options.</p>
        </header>
      </section>

      <section class="sect-inn">
        <h2 class="text-title-lg">Inputs with Icons (Default Left Position)</h2>
        <div class="form-grid">
          <label class="field">
            <span class="label">Email Address</span>
            <input class="ipt email icon" type="email" placeholder="you@example.com" data-testid="icon-input-email" />
            <span class="hint">Opt-in email icon via class="ipt email icon"</span>
          </label>

          <label class="field">
            <span class="label">Password</span>
            <input class="ipt password icon" type="password" placeholder="••••••••" data-testid="icon-input-password" />
            <span class="hint">Opt-in password icon via class="ipt password icon"</span>
          </label>

          <label class="field">
            <span class="label">Website URL</span>
            <input class="ipt url icon" type="url" placeholder="https://example.com" data-testid="icon-input-url" />
            <span class="hint">Opt-in URL icon via class="ipt url icon"</span>
          </label>

          <label class="field">
            <span class="label">Phone Number</span>
            <input class="ipt tel icon" type="tel" placeholder="+1 (555) 000-0000" data-testid="icon-input-tel" />
            <span class="hint">Opt-in phone icon via class="ipt tel icon"</span>
          </label>

          <label class="field">
            <span class="label">Search Query</span>
            <input
              class="ipt search icon"
              type="search"
              placeholder="Search documentation..."
              data-testid="icon-input-search"
            />
            <span class="hint">Opt-in search icon via class="ipt search icon"</span>
          </label>
        </div>
      </section>

      <section class="sect-inn">
        <h2 class="text-title-lg">Icon Position Configuration (Left vs Right)</h2>
        <div class="form-grid">
          <label class="field">
            <span class="label">Explicit Left Position</span>
            <input
              class="ipt search icon left"
              type="search"
              placeholder="Search left..."
              data-testid="icon-input-left"
            />
            <span class="hint">class="ipt search icon left"</span>
          </label>

          <label class="field">
            <span class="label">Right Position</span>
            <input
              class="ipt search icon right"
              type="search"
              placeholder="Search right..."
              data-testid="icon-input-right"
            />
            <span class="hint">class="ipt search icon right"</span>
          </label>

          <label class="field">
            <span class="label">Password Right Icon</span>
            <input
              class="ipt password icon right"
              type="password"
              placeholder="Password right..."
              data-testid="icon-input-password-right"
            />
            <span class="hint">class="ipt password icon right"</span>
          </label>

          <label class="field">
            <span class="label">Email Right Icon</span>
            <input
              class="ipt email icon right"
              type="email"
              placeholder="email@example.com"
              data-testid="icon-input-email-right"
            />
            <span class="hint">class="ipt email icon right"</span>
          </label>
        </div>
      </section>

      <section class="sect-inn">
        <h2 class="text-title-lg">Field States</h2>
        <div class="form-grid">
          <label class="field">
            <span class="label">Valid State</span>
            <input class="ipt email icon" type="email" value="alex@example.com" />
            <span class="hint">Normal valid input with icon</span>
          </label>

          <label class="field">
            <span class="label">Invalid State</span>
            <input
              class="ipt email icon"
              type="email"
              value="invalid-email"
              aria-invalid="true"
              data-testid="invalid-icon-input"
            />
            <span class="error">Please enter a valid email address.</span>
          </label>

          <label class="field">
            <span class="label">Disabled State</span>
            <input
              class="ipt email icon"
              type="email"
              value="disabled@example.com"
              disabled
              data-testid="disabled-icon-input"
            />
            <span class="hint">Disabled input with icon</span>
          </label>
        </div>
      </section>

      <section class="sect-inn">
        <h2 class="text-title-lg">Other Form Controls</h2>
        <div class="form-grid">
          <label class="field">
            <span class="label">Textarea</span>
            <textarea class="textarea" placeholder="Write your message here..."></textarea>
          </label>

          <label class="field">
            <span class="label">Select Dropdown</span>
            <select class="select" aria-label="Department">
              <option>Engineering</option>
              <option>Design</option>
              <option>Product</option>
            </select>
          </label>
        </div>
      </section>

      <section class="sect-inn">
        <h2 class="text-title-lg">Checkboxes & Radios</h2>
        <div class="cluster">
          <label class="cluster tight component-option">
            <input type="checkbox" class="checkbox" checked />
            <span class="text-body font-medium">Default Checkbox</span>
          </label>
          <label class="cluster tight component-option">
            <input type="checkbox" class="checkbox primary" checked />
            <span class="text-body font-medium">Primary Checkbox</span>
          </label>
          <label class="cluster tight component-option">
            <input type="radio" name="forms-radio" class="radio" checked />
            <span class="text-body font-medium">Radio 1</span>
          </label>
          <label class="cluster tight component-option">
            <input type="radio" name="forms-radio" class="radio" />
            <span class="text-body font-medium">Radio 2</span>
          </label>
          <label class="cluster tight component-option">
            <input type="checkbox" class="switch" checked />
            <span class="text-body font-medium">Switch</span>
          </label>
        </div>
      </section>
    </main>
  </body>
</html>
