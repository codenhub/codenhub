interface:
  display_name: "Motion Graphics"
  short_description: "Storyboard, animate, and render video"
  default_prompt: "Use $motion-graphics to make this video: set the format and duration, write beats and a timing table, fix key frames as stills, when it is narrated, time the narration before animating, animate on a seekable timeline, render every frame, when it has sound, mix it to a measured level, and check a contact sheet before delivering."
